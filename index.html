<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দৈনন্দিন হিসাব</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1565c0">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f1fb;--card:#fbfdff;--ink:#14263d;--mute:#5d7390;--line:#c9dcf0;--pri:#1565c0;--pri2:#e1eefc;--red:#c62828;--grn:#0b8fb3;--strike:#000;--shadow:0 4px 14px rgba(21,101,192,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#13243a;--ink:#e6f0fb;--mute:#8fa6c2;--line:#27405f;--pri:#4da3ff;--pri2:#173152;--red:#ef5350;--grn:#3cc6e6;--strike:#e6f0fb;--shadow:none}}
:root[data-theme="dark"]{--bg:#0b1624;--card:#13243a;--ink:#e6f0fb;--mute:#8fa6c2;--line:#27405f;--pri:#4da3ff;--pri2:#173152;--red:#ef5350;--grn:#3cc6e6;--strike:#e6f0fb;--shadow:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--pri2) 0,var(--bg) 300px) var(--bg) no-repeat;color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',sans-serif;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px}
body.kb .wrap{padding-bottom:60vh}
header{text-align:center;padding:10px 0 8px}
.by{font-size:14px;color:var(--mute);font-weight:500}.by b{color:var(--pri)}
h1{margin:2px auto 0;font-size:32px;color:transparent;background:linear-gradient(90deg,var(--pri),var(--grn));-webkit-background-clip:text;background-clip:text;display:inline-block;padding-bottom:6px;border-bottom:3px double var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin:6px 0 14px;box-shadow:0 8px 24px rgba(21,101,192,.35),0 0 0 2px var(--pri2)}.hero img{display:block;width:100%;height:auto}.hc{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(0deg,rgba(6,18,36,.92),rgba(6,18,36,0));color:#fff;text-align:center}.hc b{display:block;font-size:19px}.hc span{font-size:13px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--pri);border-radius:18px;padding:22px 8px;box-shadow:var(--shadow);cursor:pointer}
.tile.dp{border-top-color:#c9892b}
.tile{transition:transform .15s,box-shadow .15s}.tile:active{transform:scale(.97)}
.tile.dp .amt{color:#c9892b}.tile.dp .big{background:#faf0dc}
@media (prefers-color-scheme:dark){.tile.dp .big{background:#3a3020}}
.tile .big{font-size:42px;background:var(--pri2);width:80px;height:80px;border-radius:50%;display:grid;place-items:center}.tile b{font-size:22px}.tile .amt{font-size:18px;font-weight:700;color:var(--pri)}.tile small{color:var(--mute);font-size:13px;line-height:1.6}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar h2{margin:0;flex:1;font-size:22px;color:var(--pri)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--pri2);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}
.sum b{display:block;font-size:20px;color:var(--ink)}
.f{display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:1;min-width:110px;width:100%;margin-bottom:8px}
.f input{margin:0}
.btn{font:inherit;font-weight:600;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.g{background:var(--pri2);color:var(--ink)}.btn.rd{background:var(--red)}
.btn:not(.g):not(.rd),button.fab{background:linear-gradient(135deg,var(--pri),var(--grn))}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gh h3{margin:0;flex:1;font-size:17px;color:var(--pri);overflow-wrap:anywhere;cursor:pointer}
.gh h3 small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed var(--line)}
.shut .row,.shut .gt,.shut .f,.shut .empty{display:none}
.shut .gh{margin-bottom:0}
#pv{display:none}
@media print{body>*:not(#pv){display:none!important}#pv{display:block;color:#000;background:#fff}body{background:#fff}}
.sl{width:22px;height:22px;border-radius:50%;background:var(--pri2);color:var(--pri);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.mid{flex:1;min-width:0}.nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}.eq{white-space:nowrap}.dt{font-size:11px;color:var(--mute)}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.ic.ok{background:var(--pri);color:#fff;border-color:var(--pri)}
.ic.tk{background:var(--pri2);color:var(--grn);border:2px solid var(--grn);font-weight:700}
.ic.tk.ok{width:24px;height:24px;font-size:11px;margin:0 3px;background:rgba(198,40,40,.15);color:var(--red);border:2px solid var(--red)}
.x{border:0;background:none;color:var(--ink);cursor:pointer;font-size:22px;font-weight:700;width:30px;flex:none}
.cut .mid{text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:1px;opacity:.8}
.gt{display:flex;justify-content:space-between;margin:10px 2px 8px;font-weight:700;color:var(--pri)}
.empty{text-align:center;color:var(--mute);padding:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.bx{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.bx h3{margin:0 0 10px;color:var(--pri)}.bx p{margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;padding:13px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt.rd{color:var(--red)}
.sr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--hero) center/cover no-repeat;opacity:.32;filter:saturate(1.2);pointer-events:none}
.card,.tile,.sum div{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(10px) saturate(1.5);backdrop-filter:blur(10px) saturate(1.5);border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 30px rgba(21,101,192,.2),inset 0 1px 0 rgba(255,255,255,.55)}
.tile{border-top:4px solid var(--pri);animation:fl 6s ease-in-out infinite}.tile.dp{animation-delay:-3s}
.hero{animation:fl 8s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bx{background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(235,244,255,.55));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.5)}
.opt,input,.btn.g{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sl,.tile .big{background:rgba(255,255,255,.3)}
@media (prefers-color-scheme:dark){.card,.tile,.sum div{background:linear-gradient(135deg,rgba(40,75,120,.55),rgba(12,26,46,.35));border-color:rgba(120,170,230,.28);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}.bx{background:linear-gradient(135deg,rgba(24,46,76,.92),rgba(12,26,46,.85));border-color:rgba(120,170,230,.28)}.opt,input,.btn.g{background:rgba(255,255,255,.08)}.sl,.tile .big{background:rgba(255,255,255,.1)}body::before{opacity:.28}}
@media (prefers-reduced-motion:reduce){.tile,.hero{animation:none}}
@media print{body::before{display:none}}
body::before{display:none!important}
@media (prefers-color-scheme:light){body{background:linear-gradient(180deg,#fff 0,#e8f3fd 40%,#d3e7fa 100%) fixed}}
.iw{position:relative;display:block;flex:1;min-width:110px}.iw input,.f .iw input{padding-right:34px;margin:0;min-width:0}.bx .iw{margin-bottom:8px}
.cl{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:0;background:var(--pri2);color:var(--mute);font-size:12px;cursor:pointer;padding:0}
input:placeholder-shown+.cl{display:none}
.ic.ed,.ic.dl{width:28px;height:28px;font-size:13px}
.card.anim .row,.card.anim .gt,.card.anim .f{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ic.dl{color:var(--red);border-color:rgba(198,40,40,.45);background:rgba(198,40,40,.08)}
.btn.g svg{color:var(--pri)}
.pvw{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px}.pgi{width:100%;display:block;border-bottom:6px solid var(--pri2)}
.tst{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:rgba(20,38,61,.95);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;font-size:14px}.tst.on{opacity:1;transform:translateX(-50%)}
.gh{background:var(--pri2);border:1.5px solid var(--pri);border-radius:14px;padding:10px;margin-bottom:0;box-shadow:0 4px 10px rgba(21,101,192,.22)}
.gh h3{display:flex;align-items:center;gap:10px}
.ar{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--pri);font-size:18px;border:1px solid var(--pri);transition:transform .25s}.ar.op{transform:rotate(90deg)}
.dv{height:2px;margin:12px 0 6px;background:linear-gradient(90deg,var(--pri),rgba(21,101,192,0));border-radius:2px}.shut .dv{display:none}
.card .row,.card .gt,.card .f,.card .empty{margin-left:14px}.card .row{border-left:3px solid var(--pri2);padding-left:10px}
.ic.bk{width:48px;height:48px;display:grid;place-items:center;padding:0;font-size:0;color:var(--pri);background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.ic.bk{width:46px;height:46px;border:0;color:#fff;background:linear-gradient(135deg,var(--pri),var(--grn));box-shadow:0 4px 12px rgba(21,101,192,.4),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,box-shadow .15s}
.ic.bk:active{transform:scale(.9) translateX(-2px);box-shadow:0 2px 6px rgba(21,101,192,.4)}
.ic.bk svg{width:24px;height:24px}
.bk2{display:flex;gap:8px;margin-top:4px}.bk2 .btn{flex:1;font-size:14px;padding:12px 8px}
.bx textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px}
label.opt{box-sizing:border-box}
.cut .mid{text-decoration:none!important}
.cut .nm{text-decoration:line-through;text-decoration-color:var(--strike,#000);text-decoration-thickness:1px}
.cut .dt{text-decoration:none}

if(view=='home'){h='<div class="hero"><img src="'+HERO+'" alt=""><div class="hc"><b>আয়-ব্যয়ের হিসাব, এক জায়গায়</b><span>খরচ ও জমা হোক গোছানো ও নিখুঁত</span></div></div><div class="tiles">'+['ex','dp'].map(k=>'<div class="tile '+k+'" onclick="go(\''+k+'\')"><span class="big">'+L[k].ic+'</span><b>'+L[k].nm+'</b><span class="amt">'+tk(gall(k,1))+'</span><small>'+bn(S[k].length)+'টি শিরোনাম<br>বাকি '+tk(gall(k,0))+'</small></div>').join('')+'</div><div class="bk2"><button class="btn g" onclick="bkp()">💾 ব্যাকআপ রাখুন</button><button class="btn g" onclick="rst()">📥 ব্যাকআপ ফেরত আনুন</button></div>'}
else{const l=L[view];
h='<div class="bar"><button class="ic bk" aria-label="পেছনে" onclick="go(\'home\')">'+BK+'</button><h2>'+l.ic+' '+l.nm+'</h2><button class="btn g" onclick="sm()">'+WL+' মোট হিসাব</button></div><div class="sum"><div>'+l.tot+'<b>'+tk(gall(view,1))+'</b></div><div>বাকি<b>'+tk(gall(view,0))+'</b></div></div>';
h+=S[view].length?S[view].map(g=>'<div class="card'+(g.o?'':' shut')+'" id="c'+g.id+'"><div class="gh"><h3 onclick="tg('+g.id+')"><span class="ar'+(g.o?' op':'')+'">▸</span><span>'+esc(g.title)+'<small>'+bn(g.items.length)+'টি লেখা · মোট '+tk(tot(g.items,1))+'</small></span></h3><button class="x" onclick="A3('+g.id+',0)">⋮</button></div><div class="dv"></div>'+(g.items.length?g.items.map((x,i)=>row(g.id,x,i)).join(''):'<div class="empty">এখনো কিছু লেখা হয়নি</div>')+'<div class="gt"><span>'+l.tot+'</span><span>= '+tk(tot(g.items,1))+'</span></div><div class="f"><span class="iw"><input id="n'+g.id+'" enterkeyhint="next" onkeydown="nx(event,'+g.id+')" placeholder="'+l.ph+'">'+CL+'</span><span class="iw"><input id="a'+g.id+'" enterkeyhint="done" onkeydown="ad(event,'+g.id+')" type="number" inputmode="decimal" placeholder="টাকা">'+CL+'</span><button class="btn" onclick="addI('+g.id+')">＋ যোগ</button></div></div>').join(''):'<div class="card empty">নিচের ＋ চেপে প্রথম শিরোনাম খুলুন</div>';
h+='<button class="fab" title="নতুন শিরোনাম" onclick="addG()">＋</button>'}
document.getElementById('app').innerHTML=h}
const vv=window.visualViewport;
function fit(){const o=document.querySelector('.ov');if(!o||!vv)return;const k=innerHeight-vv.height>120;o.style.top=k?vv.offsetTop+'px':'0';o.style.height=k?vv.height+'px':'100%';o.style.bottom='auto'}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
document.addEventListener('focusin',e=>{if(e.target.tagName!='INPUT')return;const t=e.target;if(t.type=='text')setTimeout(()=>{try{const n=t.value.length;t.setSelectionRange(n,n)}catch(_){}},0);document.body.classList.add('kb');fit();setTimeout(()=>{fit();e.target.scrollIntoView({block:'center',behavior:'smooth'})},350)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||document.activeElement.tagName!='INPUT')document.body.classList.remove('kb')},200));
R();
</script><script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.addEventListener('popstate',()=>{if(document.getElementById('m').innerHTML){M();return}if(view!='home'){view='home';R()}});
(function(){const g=window.go;if(typeof g=='function'){window.go=function(v){g(v);if(v!='home'){try{history.pushState({s:1},'')}catch(e){}}}}})();
</script>
